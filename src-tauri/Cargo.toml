[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: voice research assistant"
authors = ["Kaushal Parajuli"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["process", "io-util", "macros", "sync", "time", "net"] }
cpal = "0.18.2"
base64 = "0.23.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-tungstenite = "0.30"
tract-onnx = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
core-foundation = "0.10"
core-graphics = "0.25"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The wake-word models run continuously; unoptimized they'd use far more CPU in dev builds.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
