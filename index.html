<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis</title>
    <script>
      // The window is transparent, so a page that fails to start shows nothing at all. Write any
      // start-up or later error to <research folder>/logs/frontend.log so it can be found.
      (function () {
        var send = function (line) {
          try {
            window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke("app_log", { name: "frontend", line: String(line).slice(0, 2000) });
          } catch (e) {}
        };
        window.addEventListener("error", function (e) {
          send("error: " + e.message + " at " + (e.filename || "") + ":" + (e.lineno || "") + (e.error && e.error.stack ? " | " + e.error.stack : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          send("unhandled: " + (r && r.stack ? r.stack : r));
        });
        send("page loaded: " + location.href);
        // If the app's code fails to load at all (a broken import), no error event fires and the
        // window just stays empty. After a few seconds, log it and say so instead of showing nothing.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.childElementCount) {
            send("blank: the app didn't render within 8 seconds");
            root.innerHTML =
              '<p style="font:13px -apple-system,sans-serif;color:#8ea1b4;padding:48px;text-align:center">Jarvis didn’t start properly. Quit it (⌘Q) and open it again.</p>';
          }
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
